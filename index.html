<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker - Germany</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h2>💰 Expense Tracker</h2>
<p>Germany Portfolio Project by Emirhan</p>
<div class="card">
<h4>Balance</h4>
<h1 id="balance">0 PKR</h1>
</div>
<div class="inc-exp">
<div><h4>Income</h4><p id="money-plus" class="plus">0 PKR</p></div>
<div><h4>Expense</h4><p id="money-minus" class="minus">0 PKR</p></div>
</div>
<h3>History</h3>
<ul id="list"></ul>
<h3>Add Transaction</h3>
<form id="form">
<input type="text" id="text" placeholder="Enter description...">
<input type="number" id="amount" placeholder="Amount - use minus for expense">
<button>Add Transaction</button>
</form>
</div>
<script src="script.js"></script>
</body>
</html>
