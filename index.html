<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker - Germany Ready</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>💰 Expense Tracker</h1>
  <p>Germany Portfolio Project by Emirhan</p>
  
  <div class="balance">
    <h3>بیلنس</h3>
    <h2 id="balance">0 PKR</h2>
  </div>
  
  <div class="summary">
    <div><h4>آمدنی</h4><p id="income" style="color:green">0 PKR</p></div>
    <div><h4>خرچ</h4><p id="expense" style="color:red">0 PKR</p></div>
  </div>

  <div class="form">
    <input type="text" id="text" placeholder="خرچ کی تفصیل مثلاً کرایہ">
    <input type="number" id="amount" placeholder="رقم، خرچ کے لیے - لگائیں مثلاً -500">
    <button onclick="addTransaction()">Add Transaction</button>
  </div>

  <h3>تاریخ</h3>
  <ul id="list"></ul>
</div>
<script src="script.js"></script>
</body>
</html>
